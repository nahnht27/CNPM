<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FilmSpace - Đặt mật khẩu mới</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --text: #26283b;
      --muted: #6f7284;
      --pink: #ff1584;
      --pink-dark: #e60f75;
      --line: #e9e9ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
    }

    .auth-wrapper {
      min-height: 100vh;
      display: flex;
    }

    .auth-side,
    .auth-content {
      width: 50%;
      min-height: 100vh;
    }

    .auth-side {
      position: relative;
      overflow: hidden;
      background: #f4f5f8;
    }

    .auth-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 800;
    }

    .brand span {
      color: var(--pink);
    }

    .auth-content {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 34px;
    }

    .form-container {
      width: min(440px, 100%);
    }

    h1 {
      font-size: 40px;
      margin: 0 0 10px;
    }

    .sub {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 28px;
    }

    .group {
      margin-bottom: 22px;
    }

    .group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .wrap {
      position: relative;
    }

    .wrap input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 11px 38px 11px 0;
      font-size: 15px;
      outline: none;
    }

    .wrap input:focus {
      border-bottom-color: var(--pink);
    }

    .eye {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 7px;
      background: var(--pink);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--pink-dark);
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 11px;
      border-radius: 7px;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #fff6f7;
      color: #dc3545;
    }

    .message.success {
      display: block;
      background: #f4fbf7;
      color: #198754;
    }

    @media (max-width: 800px) {

      .auth-wrapper {
        flex-direction: column;
      }

      .auth-side,
      .auth-content {
        width: 100%;
      }

      .auth-side {
        height: 300px;
        min-height: 0;
      }

      .auth-side img {
        height: 300px;
      }

      .auth-content {
        min-height: auto;
        padding: 44px 22px 54px;
      }

      h1 {
        font-size: 34px;
      }

    }
  </style>
</head>

<body>

<div class="auth-wrapper">

  <aside class="auth-side">

    <img
      src="assets/images/5.jpg"
      alt="Film photography"
    >

    <div class="brand">
      Film<span>Space</span>
    </div>

  </aside>

  <main class="auth-content">

    <div class="form-container">

      <div id="message" class="message"></div>

      <h1>Đặt mật khẩu mới</h1>

      <p class="sub">
        Mã xác nhận đã được kiểm tra.
        Hãy tạo mật khẩu mới.
      </p>

      <form id="resetForm">

        <div class="group">

          <label for="password">
            Mật khẩu mới
          </label>

          <div class="wrap">

            <input
              id="password"
              type="password"
              placeholder="Nhập mật khẩu mới"
              required
            >

            <span
              class="eye"
              onclick="togglePassword('password', this)"
            >
              ◉
            </span>

          </div>

        </div>

        <div class="group">

          <label for="confirmPassword">
            Xác nhận mật khẩu
          </label>

          <div class="wrap">

            <input
              id="confirmPassword"
              type="password"
              placeholder="Nhập lại mật khẩu"
              required
            >

            <span
              class="eye"
              onclick="togglePassword('confirmPassword', this)"
            >
              ◉
            </span>

          </div>

        </div>

        <button type="submit">
          ĐỔI MẬT KHẨU
        </button>

      </form>

    </div>

  </main>

</div>

<script>

  const API_BASE_URL = "http://127.0.0.1:9999";

  const email = sessionStorage.getItem("reset_email");

  const verified =
    sessionStorage.getItem("reset_verified");

  const messageBox =
    document.getElementById("message");

  if (!email || verified !== "true") {
    window.location.href = "forgot-password.html";
  }

  function togglePassword(inputId, button) {

    const input =
      document.getElementById(inputId);

    if (input.type === "password") {

      input.type = "text";
      button.textContent = "○";

    } else {

      input.type = "password";
      button.textContent = "◉";

    }

  }

  function showMessage(text, type = "error") {

    messageBox.textContent = text;

    messageBox.className =
      `message ${type}`;

  }

  async function parseResponse(response) {

    const text = await response.text();

    try {

      return text ? JSON.parse(text) : {};

    } catch {

      return {
        message: text || "Có lỗi xảy ra."
      };

    }

  }

  document
    .getElementById("resetForm")
    .addEventListener("submit", async (event) => {

      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 6) {

        showMessage(
          "Mật khẩu phải có ít nhất 6 ký tự."
        );

        return;
      }

      if (password !== confirmPassword) {

        showMessage(
          "Mật khẩu xác nhận không khớp."
        );

        return;
      }

      try {

        const response = await fetch(
          `${API_BASE_URL}/auth/reset-password`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password,
              passwordconfirm: confirmPassword
            })
          }
        );

        const data =
          await parseResponse(response);

        if (!response.ok) {

          showMessage(
            data.message ||
            "Không thể đổi mật khẩu."
          );

          return;
        }

        sessionStorage.removeItem(
          "reset_email"
        );

        sessionStorage.removeItem(
          "reset_verified"
        );

        showMessage(
          data.message ||
          "Đổi mật khẩu thành công.",
          "success"
        );

        setTimeout(() => {

          window.location.href =
            "auth.html";

        }, 1200);

      } catch {

        showMessage(
          "Không thể kết nối đến Backend."
        );

      }

    });

</script>

</body>
</html>
