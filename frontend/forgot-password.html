<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace - Quên mật khẩu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #26283b;
      --muted: #6f7284;
      --pink: #ff1584;
      --pink-dark: #e60f75;
      --line: #e9e9ef;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', Arial, sans-serif;
      color: var(--text);
      background: var(--white);
    }

    .auth-wrapper {
      min-height: 100vh;
      display: flex;
    }

    .auth-side {
      width: 50%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: #f4f5f8;
    }

    .auth-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .auth-side::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,.10),
        rgba(20,22,40,.14)
      );
    }

    .brand {
      position: absolute;
      z-index: 2;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 800;
    }

    .brand span {
      color: var(--pink);
    }

    .auth-content {
      width: 50%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 34px;
    }

    .form-container {
      width: min(440px, 100%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 40px;
      letter-spacing: -1.2px;
    }

    .sub-title {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .sub-title a {
      color: var(--pink);
      font-weight: 700;
      text-decoration: none;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 11px 0;
      outline: none;
      font-size: 15px;
    }

    .form-group input:focus {
      border-bottom-color: var(--pink);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 7px;
      background: var(--pink);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--pink-dark);
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 11px 13px;
      border-radius: 7px;
      font-size: 13px;
    }

    .message.error {
      display: block;
      color: #dc3545;
      background: #fff6f7;
      border: 1px solid #f1bcc2;
    }

    .message.success {
      display: block;
      color: #198754;
      background: #f4fbf7;
      border: 1px solid #bfe5d0;
    }

    @media (max-width: 800px) {
      .auth-wrapper {
        flex-direction: column;
      }

      .auth-side,
      .auth-content {
        width: 100%;
      }

      .auth-side {
        height: 300px;
        min-height: 0;
      }

      .auth-side img {
        height: 300px;
      }

      .auth-content {
        min-height: auto;
        padding: 44px 22px 54px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<div class="auth-wrapper">

  <aside class="auth-side">
    <img src="assets/images/5.jpg" alt="Film photography">
    <div class="brand">Film<span>Space</span></div>
  </aside>

  <main class="auth-content">

    <div class="form-container">

      <div id="message" class="message"></div>

      <h1>Quên mật khẩu</h1>

      <p class="sub-title">
        Nhập email của bạn và chúng tôi sẽ gửi mã xác nhận.
        <br>
        <a href="auth.html">Quay lại đăng nhập</a>
      </p>

      <form id="forgotForm">

        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="Nhập email"
            required
          >
        </div>

        <button type="submit">
          GỬI MÃ
        </button>

      </form>

    </div>

  </main>

</div>

<script>
  const API_BASE_URL = "http://127.0.0.1:9999";
  const messageBox = document.getElementById("message");

  function showMessage(text, type = "error") {
    messageBox.textContent = text;
    messageBox.className = `message ${type}`;
  }

  async function parseResponse(response) {
    const text = await response.text();

    try {
      return text ? JSON.parse(text) : {};
    } catch {
      return {
        message: text || "Có lỗi xảy ra."
      };
    }
  }

  document
    .getElementById("forgotForm")
    .addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      try {

        const response = await fetch(
          `${API_BASE_URL}/auth/forgot-password`,
          {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email
            })
          }
        );

        const data = await parseResponse(response);

        if (!response.ok) {
          showMessage(
            data.message ||
            data.error ||
            "Không thể gửi mã xác nhận."
          );
          return;
        }

        sessionStorage.setItem("reset_email", email);

        showMessage(
          data.message || "Mã OTP đã được gửi.",
          "success"
        );

        setTimeout(() => {
          window.location.href = "enter-code.html";
        }, 800);

      } catch (error) {

        showMessage(
          "Không thể kết nối đến Backend. Hãy kiểm tra Flask đang chạy."
        );

      }

    });
</script>

</body>
</html>
